<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | SmartFeedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html" aria-label="SmartFeedback, inicio">
            <div class="logo-icon"><span></span><span></span><span></span></div>
            <div class="logo-text"><strong>Smart</strong><strong>Feedback</strong></div>
        </a>
        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a><a href="caracteristicas.html">Características</a><a href="precios.html">Precios</a><a href="contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>
    <main class="page-main">
        <div class="page-heading">
            <h1>Hablemos</h1>
            <p>Cuéntanos qué necesitas y te ayudaremos a encontrar el mejor camino.</p>
        </div>
        <section class="form-panel">
            <form action="#" method="get">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
                <label for="mensaje">¿Cómo podemos ayudarte?</label>
                <textarea id="mensaje" name="mensaje" required></textarea>
                <button type="submit" class="btn-start">Enviar mensaje</button>
            </form>
        </section>
    </main>
</body>
</html>
