<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | SmartFeedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html" aria-label="SmartFeedback, inicio">
            <div class="logo-icon"><span></span><span></span><span></span></div>
            <div class="logo-text"><strong>Smart</strong><strong>Feedback</strong></div>
        </a>
        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a><a href="caracteristicas.html">Características</a><a href="precios.html">Precios</a><a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="page-main">
        <section class="form-panel">
            <h1>Crear cuenta</h1>
            <form id="formRegistro" action="#" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                <label for="confirmarPassword">Confirmar contraseña</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" autocomplete="new-password" minlength="8" required>
                <button type="submit" class="btn-start">Registrarse</button>
            </form>
            <p class="form-note">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
        </section>
    </main>
</body>
</html>
