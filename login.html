<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | SmartFeedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html" aria-label="SmartFeedback, inicio">
            <div class="logo-icon"><span></span><span></span><span></span></div>
            <div class="logo-text"><strong>Smart</strong><strong>Feedback</strong></div>
        </a>
        <nav class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a><a href="caracteristicas.html">Características</a><a href="precios.html">Precios</a><a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="page-main">
        <section class="form-panel">
            <h1>Iniciar sesión</h1>
            <form action="#" method="get">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <button type="submit" class="btn-start">Entrar</button>
            </form>
            <p class="form-note">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        </section>
    </main>
</body>
</html>
